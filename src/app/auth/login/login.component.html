
<div class="main-container" *ngIf="isLoginView">
  <header class="brand-name">CREDIAPP</header>
  <div class="content-wrapper">
    <div class="logo-section">
      <div class="logo-wrapper">
        <img src="logo.jpg" alt="Logo">
      </div>
    </div>
    <div class="form-section">
      <h1>Bienvenido</h1>
      <input type="text" [(ngModel)]="username" placeholder="usuario">
      <input type="password" [(ngModel)]="password" placeholder="contraseña">
      <button class="btn-login" (click)="onLogin()">Iniciar Sesión</button>
      <p class="footer-text">
        ¿No tienes cuenta? <a (click)="toggleView()">Registrarse</a>
      </p>
    </div>
  </div>
</div>


<div class="signup-page-wrapper" *ngIf="!isLoginView">
  <app-signup (cancel)="toggleView()"></app-signup>
</div>
